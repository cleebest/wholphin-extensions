name: Sync upstream

on:
  schedule:
    # Daily 02:30 UTC
    - cron: "30 2 * * *"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write
  issues: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Fetch upstream
        run: |
          git remote add upstream https://github.com/damontecres/wholphin-extensions.git
          git fetch upstream main

      - name: Merge upstream into sync branch
        id: merge
        run: |
          git checkout -B sync/upstream origin/main
          if git merge --no-edit upstream/main >/tmp/merge.log 2>&1; then
            echo "clean=true" >> "$GITHUB_OUTPUT"
          else
            echo "clean=false" >> "$GITHUB_OUTPUT"
            git merge --abort
            tail -20 /tmp/merge.log
          fi

      - name: Push sync branch
        if: steps.merge.outputs.clean == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: git push -f origin sync/upstream

      - name: Open / update sync PR
        if: steps.merge.outputs.clean == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh pr create --base main --head sync/upstream \
            --title "chore: sync from upstream" \
            --body "Automated sync from \`damontecres/wholphin-extensions\` (keeps the local Dolby Vision patches and mpv fork configuration)." \
            --label "dependencies" 2>/dev/null || \
          gh pr merge --auto --squash --delete-branch 2>/dev/null || true

      - name: Report merge conflict
        if: steps.merge.outputs.clean == 'false'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh issue create --title "Upstream sync conflict" \
            --body "Automatic sync from \`damontecres/wholphin-extensions\` could not be merged cleanly. Resolve conflicts manually (usually in \`wholphin-mpv/src/native/get_dependencies.sh\` or \`wholphin-mpv/src/native/patches/\`)." || true
          exit 1
